name = "arb-control-plane"
main = "src/index.ts"
compatibility_date = "2026-10-12"
compatibility_flags = ["nodejs_compat"]
account_id = "f3adabb2e83104cf7b9c244077547991"
workers_dev = true

# app/hasher lazy-init: .wasm imports resolve to WebAssembly.Module (spike 6).
rules = [
  { type = "CompiledWasm", globs = ["**/*.wasm"] },
]

# nodejs_compat: isomorphic-git (src/retire.ts) uses Buffer.
# CompiledWasm: tree-sitter hasher. worker_loaders: app/checker dynamic workers.
worker_loaders = [
  { binding = "LOADER" },
]

[[artifacts]]
binding = "ARTIFACTS"
namespace = "arb"

[[durable_objects.bindings]]
name = "ROB"
class_name = "ReorderBuffer"

[[durable_objects.bindings]]
name = "ROUTER"
class_name = "ArbRouter"

[[durable_objects.bindings]]
name = "TRUNK"
class_name = "ArbTrunk"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ReorderBuffer"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["ArbRouter", "ArbTrunk"]

[[queues.consumers]]
queue = "arb-push-events"
max_batch_size = 10
max_batch_timeout = 1

[assets]
directory = "../dashboard"
binding = "ASSETS"
run_worker_first = true

[vars]
POLL_FALLBACK = "on"
POLL_INTERVAL_MS = "3000"

# Retirement runs git fetches + Dynamic-Worker checks inside one DO call.
[limits]
cpu_ms = 30000
